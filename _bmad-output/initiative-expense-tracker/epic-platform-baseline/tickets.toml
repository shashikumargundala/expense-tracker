[[entry]]
id = 9
type = "story"
title = "Signed release APK for sharing"
description = "Creates the owner's release keystore with keytool, outside git and with backup steps, and builds the signed, R8-minified release APK through the existing KEYSTORE_* environment variables. It checks the APK installs and launches on the owner's Galaxy S23, which also closes 1.2's pending release device check, and records the release key's SHA-1 in this epic's Notes for epic-account-and-sheet's release OAuth client. It documents how to build and share the APK. The owner chooses and stores the keystore passwords and does the backup."
verify = "A signed release APK installs and launches on the owner's phone showing the shell; the release SHA-1 is recorded; no keystore file is in git."
covers = []
after = [2]
hitl = true
risk = "medium"

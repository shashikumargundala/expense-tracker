[[entry]]
id = 7
type = "story"
title = "First release on the Play closed track"
description = "Creates the app in Play Console with Play App Signing, uploads the R8 release build to the closed test track, and records the Play App Signing SHA-1 in this epic's Notes for epic-account-and-sheet's release OAuth client."
verify = "A tester installs the app from the closed track and sees the shell; the SHA-1 is recorded."
covers = ["B11"]
after = [2, 5]
hitl = true
risk = "medium"
notes = ["Decision (2026-10-28): the owner's Google Play developer account is now active, so 1.7 is unblocked.", "Decision (2026-10-27): 1.7 is still to be implemented once the owner's Google Play developer account is verified (review in progress as of 2026-10-27). Until then, story 9 (signed release APK) is the interim distribution. When enrolling in Play App Signing, use story 9's existing release key, so sideloaded installs can update from Play and epic 2 needs only one release SHA-1."]


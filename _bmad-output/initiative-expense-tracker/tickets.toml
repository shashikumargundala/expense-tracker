# The epics of initiative-expense-tracker in build order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "A clean, buildable, releasable app shell"
covers = []

[[epic]]
id = 2
slug = "epic-account-and-sheet"
title = "Shylock signs in and his Expense Sheet is ready"
covers = ["CAP-1", "CAP-2"]
after = [{ epic = 1, needs = "module scaffold, Hilt, theme and 5-tab shell, final app ID for OAuth clients" }]

[[epic]]
id = 3
slug = "epic-expenses-and-sync"
title = "Expenses work offline and the Sheet stays the truth"
covers = ["CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-6", "CAP-7", "CAP-17", "CAP-18", "CAP-19"]
after = [{ epic = 2, needs = "AccountGateway and ExpenseSheetGateway implementations, the created Expense Sheet, stored session, fake ExpenseSheetGateway" }]

[[epic]]
id = 4
slug = "epic-budgets-and-home"
title = "Shylock sees what's left before he spends"
covers = ["CAP-2", "CAP-14", "CAP-15", "CAP-16", "CAP-17"]
after = [{ epic = 3, needs = "sync engine for UpsertCategory, DeleteCategory and UpsertBudget, the shared period filter, the Expenses tab filter entry point, the money formatter" }]

[[epic]]
id = 5
slug = "epic-sms-inbox"
title = "Bank debit SMS become one-tap Expenses"
covers = ["CAP-8", "CAP-9", "CAP-10", "CAP-11", "CAP-12", "CAP-13"]
after = [{ epic = 3, needs = "the expense form bottom sheet, AddDismissal and SMS ID handling in sync" }, { epic = 4, needs = "Home Amount Left so Add from Inbox shows its effect (CAP-12)" }]
